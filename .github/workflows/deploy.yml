name: Build & Verify Doomsday Protocol

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Compile TypeScript & Build Production Bundle
        run: npm run build

      - name: Verify Cloudflare Pages Redirects Rule
        run: |
          test -f dist/_redirects
          test -f dist/index.html
